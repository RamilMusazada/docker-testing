# PostgreSQL təhlükəsizlik konfiqurasiyası
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Localhost qoşulmaları
local   all             all                                     scram-sha-256
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Bütün uzaq qoşulmalara icazə vermək - MƏHSUL MÜHİTİNDƏ TƏHLÜKƏLİ OLA BİLƏR!
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256

# Alternativ olaraq, yalnız konkret IP-lərdən qoşulmalara icazə verə bilərsiniz:
# host    all             all             dostunuzun_ip/32        scram-sha-256